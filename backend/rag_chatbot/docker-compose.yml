version: '3.8'

services:
  db:
    image: postgres:15
    container_name: rag_chatbot_postgres
    environment:
      POSTGRES_DB: rag_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: rag_chatbot_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rag_chatbot
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION_NAME=book_content
      - COHERE_API_KEY=${COHERE_API_KEY}
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # Mount the backend directory for live code updates
      - F:/bas Important projects/qwen/my-book-website/docs:/app/docs:ro  # Mount docs directory read-only using absolute path
      - ./data:/app/data  # For storing any local data
    command: >
      sh -c "python -c \"import time; time.sleep(10); import subprocess; result = subprocess.run(['python', '-c', 'from database.base import engine, Base; Base.metadata.create_all(bind=engine)'], capture_output=True); print('DB Setup:', result.stdout, result.stderr)\" &
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: