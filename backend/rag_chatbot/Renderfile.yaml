services:
- type: web
  name: rag-chatbot
  env: python
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
  - key: PORT
    value: 8000
  - key: DATABASE_URL
    sync: false
  - key: QDRANT_API_KEY
    sync: false
  - key: QDRANT_HOST
    sync: false
  - key: QDRANT_COLLECTION_NAME
    value: book_content
  - key: COHERE_API_KEY
    sync: false
  - key: DEBUG
    value: "True"